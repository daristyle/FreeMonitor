[constants]
MAGIC = { type = "u16", value = 0x464D, hex = true }
PROTOCOL_VERSION = { type = "u8", value = 1 }
MAX_PACKET_SIZE = { type = "u32", value = 1400 }
MAX_FRAME_SIZE = { type = "u32", value = 4_194_304 }
HOST_PORT = { type = "u16", value = 50500 }
DISCOVERY_PORT = { type = "u16", value = 50501 }
FRAGMENT_TIMEOUT_MS = { type = "u32", value = 100 }
CURSOR_POS_MIN_INTERVAL_MS = { type = "u32", value = 4 }
CURSOR_POS_REPEAT_INTERVAL_MS = { type = "u32", value = 250 }
RELIABLE_RESEND_INTERVAL_MS = { type = "u32", value = 100 }
HELLO_RESEND_INTERVAL_MS = { type = "u32", value = 500 }
HEARTBEAT_INTERVAL_MS = { type = "u32", value = 500 }
SESSION_TIMEOUT_MS = { type = "u32", value = 3000 }
BYE_REPEAT_INTERVAL_MS = { type = "u32", value = 20 }
KEYFRAME_REQUEST_IGNORE_MS = { type = "u32", value = 100 }
KEYFRAME_REQUEST_REPEAT_INTERVAL_MS = { type = "u32", value = 200 }
SHAPE_REQUEST_REPEAT_INTERVAL_MS = { type = "u32", value = 500 }
STATS_INTERVAL_MS = { type = "u32", value = 1000 }
DEVELOPMENT_KEYFRAME_INTERVAL_MS = { type = "u32", value = 1000 }
MAX_INCOMPLETE_FRAMES = { type = "u32", value = 4 }
MIN_SHAPE_CACHE_SIZE = { type = "u32", value = 16 }
BYE_REPEAT_COUNT = { type = "u32", value = 3 }

[enums.Codec]
JPEG = 0
H264 = 1

[enums.RejectReason]
UNSUPPORTED_VERSION = 1
NO_COMMON_CODEC = 2
INVALID_PARAMETERS = 3

[flags.FragmentFlags]
KEYFRAME = 0

[flags.CursorFlags]
VISIBLE = 0

[flags.CodecFlags]
JPEG = 0
H264 = 1

[flags.FeatureFlags]
CURSOR_OVERLAY = 0

[headers.CommonHeader]
fields = [
    { name = "magic", type = "u16", default = "MAGIC" },
    { name = "version", type = "u8", default = "PROTOCOL_VERSION" },
    { name = "type", type = "u8", default = "PACKET_TYPE" },
    { name = "sessionId", type = "u32" },
    { name = "seq", type = "u32" },
    { name = "headerReserved", type = "u32", default = 0 },
    { name = "timestampUs", type = "u64" },
]

[headers.ControlHeader]
after = "CommonHeader"
fields = [
    { name = "msgId", type = "u32" },
    { name = "controlReserved", type = "u32", default = 0 },
]

[packets.VIDEO_FRAGMENT]
className = "VideoFragment"
type = 0x01
header = "CommonHeader"
payload = "MAX_FRAGMENT_PAYLOAD"
fields = [
    { name = "frameId", type = "u32" },
    { name = "fragIndex", type = "u16" },
    { name = "fragCount", type = "u16" },
    { name = "frameSize", type = "u32" },
    { name = "codec", type = "u8" },
    { name = "flags", type = "u8" },
    { name = "reserved", type = "u16", default = 0 },
    { name = "captureTimestampUs", type = "u64" },
]

[packets.CURSOR_POS]
className = "CursorPos"
type = 0x10
header = "CommonHeader"
fields = [
    { name = "shapeId", type = "u32" },
    { name = "x", type = "i32" },
    { name = "y", type = "i32" },
    { name = "flags", type = "u8" },
    { name = "reserved0", type = "u8", default = 0 },
    { name = "reserved1", type = "u16", default = 0 },
]

[packets.CURSOR_SHAPE]
className = "CursorShape"
type = 0x11
header = "CommonHeader"
payload = "MAX_SHAPE_PAYLOAD"
fields = [
    { name = "shapeId", type = "u32" },
    { name = "fragIndex", type = "u16" },
    { name = "fragCount", type = "u16" },
    { name = "width", type = "u16" },
    { name = "height", type = "u16" },
    { name = "hotspotX", type = "u16" },
    { name = "hotspotY", type = "u16" },
]

[packets.HELLO]
className = "Hello"
type = 0x20
header = "ControlHeader"
fields = [
    { name = "width", type = "u16" },
    { name = "height", type = "u16" },
    { name = "refreshHz", type = "u16" },
    { name = "codecs", type = "u8" },
    { name = "features", type = "u8" },
]

[packets.WELCOME]
className = "Welcome"
type = 0x21
header = "ControlHeader"
fields = [
    { name = "width", type = "u16" },
    { name = "height", type = "u16" },
    { name = "fps", type = "u16" },
    { name = "codec", type = "u8" },
    { name = "features", type = "u8" },
]

[packets.ACK]
className = "ACK"
type = 0x22
header = "ControlHeader"
fields = [
    { name = "ackedMsgId", type = "u32" },
]

[packets.HEARTBEAT]
className = "Heartbeat"
type = 0x23
header = "ControlHeader"
fields = [
    { name = "echoTimestampUs", type = "u64" },
    { name = "echoDelayUs", type = "u32" },
    { name = "reserved", type = "u32", default = 0 },
]

[packets.KEYFRAME_REQUEST]
className = "KeyframeRequest"
type = 0x24
header = "ControlHeader"
fields = []

[packets.SHAPE_REQUEST]
className = "ShapeRequest"
type = 0x25
header = "ControlHeader"
fields = [
    { name = "shapeId", type = "u32" },
]

[packets.STATS]
className = "Stats"
type = 0x26
header = "ControlHeader"
fields = [
    { name = "packetsReceived", type = "u32" },
    { name = "packetsLost", type = "u32" },
    { name = "framesCompleted", type = "u32" },
    { name = "framesDropped", type = "u32" },
    { name = "bytesReceived", type = "u32" },
]

[packets.BYE]
className = "Bye"
type = 0x27
header = "ControlHeader"
fields = []

[packets.REJECT]
className = "Reject"
type = 0x28
header = "ControlHeader"
fields = [
    { name = "reason", type = "u8" },
    { name = "version", type = "u8" },
    { name = "reserved", type = "u16", default = 0 },
]
